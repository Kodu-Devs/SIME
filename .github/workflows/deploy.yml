name: Deploy SIME to Oracle VPS

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-sime-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Conectar por SSH y actualizar VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ubuntu
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail

            cd ~/sime

            # Sincronización limpia con main (no toca .env, docker-compose.yml ni Dockerfile)
            git fetch origin main
            git reset --hard origin/main

            # Compilar frontend de forma exacta sin alterar package-lock.json
            docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$(pwd):/app" -w /app node:22-alpine sh -c "npm ci && npm run build"

            # Actualizar dependencias de PHP
            docker exec -i sime-app composer install --no-interaction --prefer-dist --optimize-autoloader

            # Ejecutar migraciones sin seeders
            docker exec -i sime-app php artisan migrate --force

            # Limpiar caché
            docker exec -i sime-app php artisan optimize:clear

      - name: Notificar éxito a Discord
        if: success()
        run: |
          curl -fsS -H "Content-Type: application/json" \
          -d '{"content": "🚀 **SIME Actualizado**: Se ha desplegado una nueva versión en producción correctamente."}' \
          "${{ secrets.DISCORD_WEBHOOK }}"

      - name: Notificar error a Discord
        if: failure()
        run: |
          curl -fsS -H "Content-Type: application/json" \
          -d '{"content": "❌ **Error de Despliegue**: Falló la actualización automática de SIME en la VPS. Revisa los logs en GitHub Actions."}' \
          "${{ secrets.DISCORD_WEBHOOK }}"